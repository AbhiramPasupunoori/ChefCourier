spring.application.name=ChefCourier

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chefcourier_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:chefcourier_app}
spring.datasource.password=${DB_PASSWORD:ChefCourier@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.serialization.write-dates-as-timestamps=false

app.jwt.secret=${JWT_SECRET:ChefCourierDevelopmentJwtSecretKey2026MustBeAtLeast32BytesLong}
app.jwt.issuer=ChefCourier
app.jwt.expiration-ms=86400000

app.seed-demo=${SEED_DEMO:true}

server.error.include-message=always
server.error.include-binding-errors=always
