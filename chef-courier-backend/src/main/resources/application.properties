spring.application.name=ChefCourier

# Application server
server.port=8080

# MySQL connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chefcourier_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:chefcourier_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Development error responses
server.error.include-message=always
server.error.include-binding-errors=always
